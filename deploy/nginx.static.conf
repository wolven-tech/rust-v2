log_format privacy_min '$time_iso8601 "$request_method $uri" $status ${request_time}s';

# Keep cache policy at server scope so Nginx still inherits every security
# header below into each location. Only successful public responses are shared.
# Fingerprinted assets may be immutable; an unversioned 3D render may not.
map "$status:$uri" $public_cache_control {
    default "private, no-store";
    ~^200:/health$ "private, no-store";
    "~^200:/assets/.+-(dxh[0-9a-f]{16}|[0-9a-f]{16,})\.[^/]+$" "public, max-age=31536000, immutable";
    ~^200:/assets/ "public, max-age=0, s-maxage=3600";
    "~^200:/(robots\.txt|sitemap\.xml|llms\.txt|google[^/]*\.html|[a-f0-9]{32}\.txt)$" "public, max-age=0, s-maxage=3600";
    ~^200:/ "public, max-age=0, s-maxage=86400, stale-while-revalidate=604800";
}

server {
    listen 8080;
    server_name _;
    absolute_redirect off;
    root /public;
    index index.html;

    access_log /var/log/nginx/access.log privacy_min;
    error_log /var/log/nginx/error.log warn;

    charset utf-8;
    gzip on;
    gzip_vary on;
    gzip_types application/javascript application/json application/wasm image/svg+xml text/css text/plain;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Cache-Control $public_cache_control always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header X-Frame-Options "DENY" always;
    # Dioxus hydration currently evaluates its serialized interpreter payload,
    # and motion primitives set computed style attributes. Script `unsafe-inline`
    # stays forbidden because xtask externalizes every executable bootstrap.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-eval' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location ~ "^/(robots\.txt|sitemap\.xml|llms\.txt|google[^/]*\.html|[a-f0-9]{32}\.txt)$" {
        try_files $uri =404;
    }

    location ^~ /assets/ {
        try_files $uri =404;
    }

    location ~ ^(.+)/$ {
        return 308 $1$is_args$args;
    }

    location / {
        try_files $uri/index.html $uri =404;
    }
}
