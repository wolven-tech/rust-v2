log_format privacy_min '$time_iso8601 "$request_method $uri" $status ${request_time}s';

# App HTML can carry private state after hydration. Never put it in a shared
# cache; only content-hashed static assets get the long public lifetime.
map "$status:$uri" $app_cache_control {
    default "private, no-store";
    "~^200:/assets/.+-(dxh[0-9a-f]{16}|[0-9a-f]{16,})\.[^/]+$" "public, max-age=31536000, immutable";
    ~^200:/assets/ "public, max-age=0, s-maxage=3600";
}

server {
    listen 8080;
    server_name _;
    absolute_redirect off;
    root /public;
    index index.html;

    access_log /var/log/nginx/access.log privacy_min;
    error_log /var/log/nginx/error.log warn;

    charset utf-8;
    gzip on;
    gzip_vary on;
    gzip_types application/javascript application/json application/wasm image/svg+xml text/css text/plain;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Cache-Control $app_cache_control always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-eval' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /robots.txt {
        try_files $uri =404;
    }

    location ^~ /assets/ {
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
