# Shared clippy configuration for the rust-v2 workspace.
#
# MSRV is the highest of the workspace's dependencies' own `rust-version`
# floors: allsource-core needs 1.92, allframe 1.89, dioxus 1.83, edition 2024
# needs 1.85. We pin the toolchain to 1.97.1 (rust-toolchain.toml) and declare
# 1.92 here so clippy's MSRV-aware lints stay honest.
msrv = "1.92.0"

warn-on-all-wildcard-imports = true
