[package]
name = "rv2-domain"
description = "Pure domain invariants, validation and authorization predicates. No I/O, no clock. WASM-safe (layer 1)."
edition.workspace = true
license.workspace = true
version.workspace = true
# Never published: internal workspace crate. Also what makes cargo-deny's
# `allow-wildcard-paths` apply — it is skipped for publishable crates.
publish = false

[dependencies]
chrono.workspace = true
rv2-api-types.workspace = true
rv2-events.workspace = true
thiserror.workspace = true
uuid.workspace = true
