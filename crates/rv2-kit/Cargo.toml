[package]
name = "rv2-kit"
description = "Agent and product components built clean-room from functional specs. WASM-safe (layer 2), opt-in."
edition.workspace = true
license.workspace = true
version.workspace = true
publish = false

[dependencies]
# Same renderer-agnostic set as rv2-ui: the apps choose `web` / `fullstack`.
dioxus = { workspace = true, default-features = false, features = ["lib", "mounted"] }
rv2-affect.workspace = true

# The kit's browser helpers call the DOM directly instead of eval'ing JS
# strings, so a page with `script-src 'self' 'wasm-unsafe-eval'` (no
# `'unsafe-eval'`) can host it. `Location` is not used by the kit: dioxus-web
# 0.7.10 needs it and does not enable it, so an app built on the kit alone
# failed to compile without it.
[target.'cfg(target_arch = "wasm32")'.dependencies]
futures-channel.workspace = true
js-sys.workspace = true
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
web-sys = { workspace = true, features = [
  "Clipboard",
  "Document",
  "DomRect",
  "Element",
  "FocusOptions",
  "HtmlDetailsElement",
  "HtmlElement",
  "Location",
  "Navigator",
  "NodeList",
  "ResizeObserver",
  "Window",
] }

[dev-dependencies]
dioxus-ssr.workspace = true
