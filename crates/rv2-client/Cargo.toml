[package]
name = "rv2-client"
description = "Typed gloo-net client for apps/api. WASM-safe (layer 2)."
edition.workspace = true
license.workspace = true
version.workspace = true

[dependencies]
gloo-net.workspace = true
rv2-api-types.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
uuid.workspace = true
# `RequestCredentials` is what carries the HttpOnly session cookie (D17). It is
# the same web-sys feature getformlab's WASM frontend enables.
web-sys = { workspace = true, features = ["RequestCredentials"] }
