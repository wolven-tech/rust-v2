[package]
name = "rv2-a2ui-dioxus"
description = "Renders rv2 A2UI surfaces with rv2-ui instructions. WASM-safe (layer 2)."
edition.workspace = true
license.workspace = true
version.workspace = true
# Never published: internal workspace crate. Also what makes cargo-deny's
# `allow-wildcard-paths` apply — it is skipped for publishable crates.
publish = false

[dependencies]
# Same renderer-agnostic set as `rv2-ui`: the app picks `web`.
dioxus = { workspace = true, default-features = false, features = ["lib", "mounted"] }
rv2-a2ui.workspace = true
rv2-ui.workspace = true
serde_json.workspace = true

[dev-dependencies]
dioxus-ssr.workspace = true
