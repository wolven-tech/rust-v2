[package]
name = "rv2-allsource"
description = "AllSource SDK wrapper: writer, folders, projection workers. SERVER-ONLY (layer 2)."
edition.workspace = true
license.workspace = true
version.workspace = true
# Never published: internal workspace crate. Also what makes cargo-deny's
# `allow-wildcard-paths` apply — it is skipped for publishable crates.
publish = false

[dependencies]
allsource.workspace = true
reqwest.workspace = true
serde = { workspace = true, features = ["derive"] }
# `clock` is enabled here (and NOT in the workspace default) because this is a
# server crate: the writer stamps `occurred_at` when the caller does not supply
# one. WASM crates must never get this feature — see §2.2 trap 2.
chrono = { workspace = true, features = ["clock"] }
rv2-api-types.workspace = true
rv2-events.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
uuid = { workspace = true, features = ["v4"] }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
# `tests/core_contract.rs` talks to Core over raw HTTP on purpose: it asserts
# what the WIRE does, so routing it through the SDK would test the SDK's
# interpretation instead of Core's behaviour.
reqwest = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true, features = ["v4"] }
