[package]
name = "better-auth"
version = "0.10.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/better-auth-rs/better-auth-rs"
description = "Vendored better-auth library; see PROVENANCE.md"
readme = "README.md"
autobins = false
autoexamples = false
autotests = false
autobenches = false

[lib]
name = "better_auth"
path = "src/lib.rs"

[features]
default = ["native-tls"]
native-tls = ["better-auth-api/native-tls"]
rustls = ["better-auth-api/rustls"]
axum = ["dep:axum", "dep:tower", "dep:url", "better-auth-core/axum"]
derive = ["better-auth-core/derive"]
sqlx-postgres = ["dep:sqlx", "better-auth-core/sqlx-postgres"]
redis-cache = ["dep:redis"]

[dependencies]
argon2 = "0.5"
async-trait = "0.1"
axum = { version = "0.8", optional = true }
base64 = "0.22"
better-auth-api = { version = "0.10.0", default-features = false }
better-auth-core = "0.10.0"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
jsonwebtoken = "9"
rand = "0.8"
redis = { version = "0.27", optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sqlx = { version = "0.8", optional = true, features = ["runtime-tokio-rustls", "postgres", "chrono", "uuid", "json"] }
thiserror = "2.0"
tokio = { version = "1.0", features = ["full"] }
tower = { version = "0.5", optional = true }
tracing = "0.1"
url = { version = "2", optional = true }
uuid = { version = "1.18", features = ["v4", "v7", "serde"] }
