version = "1"

[workspace]
name = "rust-v2"
root = "."

# ── tools ────────────────────────────────────────────────────────────────────
# `tooling/meta`'s config model is fully generic (`tools` is a
# HashMap<String, ToolConfig>, `project_type` is a free String), so `dx` is
# declarable without touching meta's source.

[tools.cargo]
enabled = true
command = "cargo"
for_languages = ["rust"]
for_tasks = ["build", "test", "fmt", "clippy", "audit", "check"]

[tools.bacon]
enabled = true
command = "bacon"
for_languages = ["rust"]
for_tasks = ["dev"]

[tools.dx]
enabled = true
command = "dx"
for_languages = ["rust"]
for_tasks = ["dev", "build"]

[tools.allsource]
enabled = true
command = "allsource-core"
for_tasks = ["dev"]

# ── infra: AllSource Core on :3900 ───────────────────────────────────────────
# `allsource-core` is a plain crates.io binary (`cargo install allsource-core`),
# so local dev needs no Docker at all. `docker-compose.yml` remains as the
# alternative — see the README.
[projects.infra]
type = "allsource"
path = "."
[projects.infra.tasks]
dev = { tool = "allsource", command = "" }

# Stylesheets. `dx build`/`dx bundle` only *copy* `assets/tailwind.css`; they do
# not run Tailwind. Without this step both apps ship the uncompiled `@import`
# line as a 23-byte stylesheet and render completely unstyled, while every
# command still reports success. Run it before the `app`/`web` builds.
[projects.styles]
type = "rust"
path = "tooling/tailwind"
dev_default = false
[projects.styles.tasks]
build = { tool = "cargo", command = "run -q -p tailwind-build" }

# ── apps ─────────────────────────────────────────────────────────────────────
[projects.api]
type = "rust"
path = "apps/api"
[projects.api.tasks]
dev = { tool = "bacon", command = "run-long" }
build = { tool = "cargo", command = "build --release -p api --features allsource-auth" }
test = { tool = "cargo", command = "test -p api" }
clippy = { tool = "cargo", command = "clippy -p api --all-targets -- -D warnings" }
check = { tool = "cargo", command = "check -p api --all-targets" }

[projects.app]
type = "rust"
path = "apps/app"
[projects.app.tasks]
dev = { tool = "dx", command = "serve --package app --platform web --port 4402" }
build = { tool = "dx", command = "bundle --package app --platform web --release" }
test = { tool = "cargo", command = "test -p app" }
clippy = { tool = "cargo", command = "clippy -p app --all-targets -- -D warnings" }

[projects.web]
type = "rust"
path = "apps/web"
[projects.web.tasks]
dev = { tool = "dx", command = "serve --package web --platform web --port 4401" }
build = { tool = "dx", command = "bundle --package web --platform web --release" }
test = { tool = "cargo", command = "test -p web" }
clippy = { tool = "cargo", command = "clippy -p web --all-targets -- -D warnings" }

# ── library crates: build/test only, no dev task (excluded from `meta dev`) ───
[projects.rv2-events]
type = "rust"
path = "crates/rv2-events"
[projects.rv2-events.tasks]
build = { tool = "cargo", command = "build -p rv2-events" }
test = { tool = "cargo", command = "test -p rv2-events" }
clippy = { tool = "cargo", command = "clippy -p rv2-events --all-targets -- -D warnings" }

