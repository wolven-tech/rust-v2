version = "1"

[workspace]
name = "rust-v2"
root = "."

# ── tools ────────────────────────────────────────────────────────────────────
# `monorepo-meta`'s config model is fully generic (`tools` is a
# HashMap<String, ToolConfig>, `project_type` is a free String), so `dx` is
# declarable without forking the tool. Install it with
# `cargo install monorepo-meta`; it is a published crate, not vendored here.

[tools.cargo]
enabled = true
command = "cargo"
for_languages = ["rust"]
for_tasks = ["build", "test", "fmt", "clippy", "audit", "check"]

[tools.bacon]
enabled = true
command = "bacon"
for_languages = ["rust"]
for_tasks = ["dev"]

[tools.dx]
enabled = true
command = "dx"
for_languages = ["rust"]
for_tasks = ["dev", "build"]

# ── infra: AllSource Core on :3900 ───────────────────────────────────────────
# `allsource-core` is a plain crates.io binary (`cargo install allsource-core`),
# so local dev needs no Docker at all. `docker-compose.yml` remains as the
# alternative — see the README.
#
# Routed through xtask rather than declared as its own tool: `meta doctor`
# probes every declared tool with `--version`, and `allsource-core` has no such
# flag — the probe starts a server and doctor hangs forever.
[projects.infra]
type = "rust"
path = "."
[projects.infra.tasks]
dev = { tool = "cargo", command = "run -q -p xtask -- core" }

# Development commands. `cargo xtask ci` is the whole local gate and is exactly
# what CI runs; `styles` compiles the stylesheets.
#
# Stylesheets need their own task because `dx build`/`dx bundle` only *copy*
# `assets/tailwind.css` — they do not run Tailwind. Without it both apps ship
# the uncompiled `@import` line as a 23-byte stylesheet and render completely
# unstyled, while every command still reports success. The compiled CSS is
# committed, so this only matters after editing classes; `cargo xtask ci` fails
# if what is committed has gone stale.
[projects.xtask]
type = "rust"
path = "tooling/xtask"
dev_default = false
[projects.xtask.tasks]
build = { tool = "cargo", command = "run -q -p xtask -- styles" }
check = { tool = "cargo", command = "run -q -p xtask -- ci" }
test = { tool = "cargo", command = "run -q -p xtask -- live" }

# ── apps ─────────────────────────────────────────────────────────────────────
[projects.api]
type = "rust"
path = "apps/api"
[projects.api.tasks]
dev = { tool = "bacon", command = "run-long" }
build = { tool = "cargo", command = "build --release -p api --features allsource-auth" }
test = { tool = "cargo", command = "test -p api" }
clippy = { tool = "cargo", command = "clippy -p api --all-targets -- -D warnings" }
check = { tool = "cargo", command = "check -p api --all-targets" }

[projects.app]
type = "rust"
path = "apps/app"
[projects.app.tasks]
dev = { tool = "dx", command = "serve --package app --platform web --port 4402" }
build = { tool = "dx", command = "bundle --package app --platform web --release" }
test = { tool = "cargo", command = "test -p app" }
clippy = { tool = "cargo", command = "clippy -p app --all-targets -- -D warnings" }

[projects.web]
type = "rust"
path = "apps/web"
[projects.web.tasks]
dev = { tool = "dx", command = "serve --package web --platform web --port 4401" }
build = { tool = "dx", command = "bundle --package web --platform web --release" }
test = { tool = "cargo", command = "test -p web" }
clippy = { tool = "cargo", command = "clippy -p web --all-targets -- -D warnings" }

# ── library crates: build/test only, no dev task (excluded from `meta dev`) ───
[projects.rv2-events]
type = "rust"
path = "crates/rv2-events"
[projects.rv2-events.tasks]
build = { tool = "cargo", command = "build -p rv2-events" }
