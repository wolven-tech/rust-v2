test = { tool = "cargo", command = "test -p better-auth-allsource" }

# ── tooling ──────────────────────────────────────────────────────────────────
[projects.meta]
type = "rust"
path = "tooling/meta"
[projects.meta.tasks]
build = { tool = "cargo", command = "build --release -p monorepo-meta" }
test = { tool = "cargo", command = "test -p monorepo-meta" }
fmt = { tool = "cargo", command = "fmt --all -- --check" }
fmt-fix = { tool = "cargo", command = "fmt --all" }
audit = { tool = "cargo", command = "audit" }

[projects.pg2events]
type = "rust"
path = "tooling/pg2events"
[projects.pg2events.tasks]
build = { tool = "cargo", command = "build -p pg2events" }
test = { tool = "cargo", command = "test -p pg2events" }
