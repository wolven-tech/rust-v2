[package]
name = "api"
description = "The rust-v2 HTTP API. The only server process."
edition.workspace = true
license.workspace = true
version.workspace = true

[[bin]]
name = "api"
path = "src/main.rs"

[lib]
name = "api"
path = "src/lib.rs"

[features]
default = []
# Selects the real AllSource-backed better-auth adapter. OFF by default so
# `cargo test -p api` is hermetic and needs no running Core (§5.2). `meta dev`
# and the release build turn it on.
allsource-auth = []

[dependencies]
# D5: allframe supplies resilience / rate-limit / health primitives as a
# LIBRARY. We do not adopt its `App` server — see the deviation note in
# `main.rs` and OQ-8.
allframe.workspace = true
allsource.workspace = true
axum.workspace = true
axum-extra.workspace = true
better-auth.workspace = true
better-auth-allsource.workspace = true
better-auth-core.workspace = true
chrono = { workspace = true, features = ["clock"] }
rv2-allsource.workspace = true
rv2-api-types.workspace = true
rv2-domain.workspace = true
rv2-events.workspace = true
rv2-shared.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tower.workspace = true
tower-http.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid = { workspace = true, features = ["v4", "v5"] }

[dev-dependencies]
reqwest.workspace = true
