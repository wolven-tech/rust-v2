[package]
name = "web"
description = "Dioxus marketing site, built SSG. Replaces rust-v1 apps/web (Next.js)."
edition.workspace = true
license.workspace = true
version.workspace = true

[[bin]]
name = "web"
path = "src/main.rs"

[features]
default = ["web"]
# The `server` feature exists for the SSG BUILD ONLY (D8). Nothing runs it in
# production — `dx bundle --web --ssg` uses it at build time to render each
# route to static HTML, and the output is a `public/` folder on a static host.
# That is what keeps "one server process" true.
server = ["dioxus/server"]
web = ["dioxus/web"]

[dependencies]
dioxus = { workspace = true, features = ["fullstack", "launch", "lib", "router"] }
rv2-ui.workspace = true
