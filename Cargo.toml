[workspace]
members = [
  "apps/api",
  "apps/app",
  "apps/web",
  "crates/better-auth-allsource",
  "crates/rv2-allsource",
  "crates/rv2-api-types",
  "crates/rv2-client",
  "crates/rv2-domain",
  "crates/rv2-events",
  "crates/rv2-shared",
  "crates/rv2-ui",
  "tooling/meta",
  "tooling/pg2events",
  "tooling/tailwind",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
version = "0.1.0"

[workspace.dependencies]
# ── AllSource ────────────────────────────────────────────────────────────────
allframe = { version = "0.1.28", default-features = false, features = [
  "health",
  "openapi",
  "rate-limit",
  "resilience",
  "router",
] }
allframe-core = { version = "0.1.28", default-features = false }
allsource = { version = "0.23.0", default-features = false, features = [
  "projection-worker",
  "rustls",
] }

# ── Auth ─────────────────────────────────────────────────────────────────────
# `default-features = false`: better-auth's default feature is `native-tls`,
# which drags openssl-sys into the tree and trips the deny.toml ban. Everything
# else here is rustls, so this must be too.
better-auth = { version = "0.10.0", default-features = false, features = [
  "axum",
  "rustls",
] }
better-auth-allsource = { path = "crates/better-auth-allsource", default-features = false, features = [
  "rustls",
] }
better-auth-core = { version = "0.10.0" }

# ── Server ───────────────────────────────────────────────────────────────────
axum = { version = "0.8.9", features = ["macros"] }
axum-extra = { version = "0.12.6", features = ["cookie", "typed-header"] }
# NOTE: reqwest 0.13 renamed the TLS feature `rustls-tls` -> `rustls`. The
# architecture doc's table says `rustls-tls`, which is the 0.12 spelling and
# does not resolve here.
reqwest = { version = "0.13.4", default-features = false, features = [
  "json",
  "rustls",
] }
tokio = { version = "1.53", features = [
  "macros",
  "net",
  "rt-multi-thread",
  "signal",
  "sync",
  "time",
] }
tower = "0.5"
tower-http = { version = "0.6.11", features = ["cors", "trace"] }

# ── Frontend ─────────────────────────────────────────────────────────────────
# `default-features = false` here (not `true`) so member crates may opt out:
# cargo forbids a member from overriding an inherited `default-features = true`.
# `rv2-ui` needs the renderer-agnostic `lib` set; the apps add `web` /
# `fullstack` and re-enable what they need.
dioxus = { version = "0.7.10", default-features = false }
gloo-net = { version = "0.7", default-features = false, features = [
  "http",
  "json",
] }
web-sys = { version = "0.3" }

# ── Shared, WASM-safe ────────────────────────────────────────────────────────
# NOTE: `chrono` here is the WASM-safe form (D-WASM in §2.2 of the architecture
# doc): no default features, so no `wasmbind`/`js-sys` clock. Server crates that
# genuinely need `Utc::now()` opt into `features = ["clock"]` locally.
chrono = { version = "0.4.45", default-features = false, features = [
  "alloc",
  "serde",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
# `v4` is deliberately NOT in the shared feature set — see §2.2 trap 1: WASM
# crates never mint UUIDs, so they never pull `getrandom`.
uuid = { version = "1", features = ["serde"] }

# ── Observability ────────────────────────────────────────────────────────────
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# ── Internal ─────────────────────────────────────────────────────────────────
rv2-allsource = { path = "crates/rv2-allsource" }
rv2-api-types = { path = "crates/rv2-api-types" }
rv2-client = { path = "crates/rv2-client" }
rv2-domain = { path = "crates/rv2-domain" }
rv2-events = { path = "crates/rv2-events" }
rv2-shared = { path = "crates/rv2-shared" }
rv2-ui = { path = "crates/rv2-ui" }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true

# `dx` builds the wasm bundle with its own `wasm-release` profile, NOT `release`
# — so everything tuned above applies to the server binary and native builds
# and never reached the browser. Defining it explicitly is what actually sizes
# the bundle. `opt-level = "z"` over `"s"` because a wasm payload is downloaded
# before it runs, so bytes cost more than the marginal speed does.
[profile.wasm-release]
inherits = "release"
codegen-units = 1
lto = "fat"
opt-level = "z"
panic = "abort"
strip = true
