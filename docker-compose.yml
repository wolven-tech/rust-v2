# Local AllSource stack for rust-v2.
#
# Copied in shape from `all-source-os/all-source:docker-compose.community.yml`.
#
# R6 — the ports here are the ONLY place local AllSource ports are fixed.
# Nothing in the Rust source hard-codes one: `ServerConfig::from_env` requires
# ALLSOURCE_CORE_URL and ALLSOURCE_QUERY_URL and has no fallback for them.
# (Three upstream sources give three different port pairs; this file picks one
# and `.env.example` points at it.)
#
# ## Images: use the `-community` tags
#
# The unsuffixed `allsource-core` / `allsource-query-service` images are the
# **enterprise** builds (BSL 1.1) and require `docker login ghcr.io` with a
# token — pulling them anonymously returns `denied`. The Apache-2.0 community
# builds below are public and need no credentials.
#
# Caveat: as of 2026-08-11 the community images publish **linux/amd64 only**.
# On Apple Silicon they run under emulation, which is slow. `platform` is set
# explicitly so Compose does not fail the pull outright; if the emulation
# overhead is not worth it, the native binary is the faster local path:
#
#     cargo install allsource-core
#     ALLSOURCE_DATA_DIR=.allsource-data ALLSOURCE_DEV_MODE=true allsource-core
#
# That binary is what `meta dev` runs, what CI runs, and what the vertical
# slice was verified against.

services:
  core:
    image: ghcr.io/all-source-os/allsource-core-community:latest
    platform: linux/amd64
    ports:
      - "3900:3900"
    environment:
      ALLSOURCE_HOST: "0.0.0.0"
      ALLSOURCE_PORT: "3900"
      ALLSOURCE_DATA_DIR: "/app/data"
      # Dev mode bypasses API-key auth. NEVER set this outside local dev.
      ALLSOURCE_DEV_MODE: "true"
      RUST_LOG: "allsource_core=info"
    volumes:
      - core-data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3900/health"]
      interval: 10s
      timeout: 5s
      start_period: 5s
      retries: 3

  # The Query Service is optional **for the read paths rust-v2 uses**, which is
  # a narrower claim than "optional".
  #
  # `QueryClient` is a thin `HttpTransport` wrapper pointed at whatever URL you
  # configure — it is not bound to the Query Service. The methods this codebase
  # calls (`query_events`, `get_entity_events`, `query_and_fold`) hit
  # `/api/v1/events/query`, which the SDK documents as *Core's* endpoint, and
  # the vertical slice reads data back with ALLSOURCE_QUERY_URL on :3900.
  #
  # But four `QueryClient` methods — `list_prime_projections`,
  # `define_prime_projection`, `project_node`, `node_field_provenance` —
  # deserialize a gateway-only `{"data": ...}` envelope and will NOT work
  # against Core. Bring this service up before using any of them, and for the
  # gateway concerns it owns: per-tenant rate limits, quotas, billing, and any
  # external or untrusted client.
  query-service:
    image: ghcr.io/all-source-os/allsource-query-service-community:latest
    platform: linux/amd64
    profiles: ["gateway"]
    ports:
      - "3902:3902"
    environment:
      CORE_URL: "http://core:3900"
      CORE_WS_URL: "ws://core:3900/api/v1/events/stream"
      ALLSOURCE_EDITION: "community"
      PORT: "3902"
      SECRET_KEY_BASE: "community-dev-secret-key-minimum-64-chars-change-in-production-please"
    depends_on:
      core:
        condition: service_healthy

volumes:
  core-data:
