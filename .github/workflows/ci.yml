name: CI

# Four jobs, split by what they NEED rather than by what they check.
#
# It was eight. `cargo audit` and `cargo deny check advisories` read the same
# RustSec database, so one of them was pure duplication. rustfmt, clippy,
# build+test and the predecessor greps all wanted the same toolchain and the same
# warm target/ — as separate jobs they each paid a runner spin-up and compiled
# the workspace again to report on it.
#
# What is left is split where the split buys something real: a different
# toolchain target (wasm32), a different tool that must not share a cache
# (cargo-deny), or a live server (Core).

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2

      # Cheapest first, so a formatting slip does not cost a full compile to
      # discover. They share one warm target/ — the reason these are one job.
      - run: cargo fmt --all -- --check

      # `--all-targets` covers tests and benches too; a lint that only fires in
      # a test module is still a lint.
      # `--all-features` too: `apps/api`'s `allsource-auth` feature swaps the
      # better-auth adapter, and a lint inside that cfg branch is still a lint.
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - run: cargo build --workspace
      - run: cargo test --workspace

      # The point of the exercise: no predecessor stack, anywhere.
      #
      # This used to need exclusions — a migration binary existed to read the old
      # database, and several modules carried comments naming what they replaced,
      # so a bare grep was non-empty and the check had to allow-list prose. Both
      # the binary and the comments are gone, so the check is now the strict form
      # it always wanted to be: zero matches, no exceptions, docs included.
      - name: No predecessor database anywhere
        run: |
          set -euo pipefail
          if grep -rinE 'supabase|postgres|pg2events' \
               --exclude-dir=.git --exclude-dir=target --exclude-dir=.github . ; then
            echo "::error::a reference to the predecessor stack is present"
            exit 1
          fi

      - name: No package.json / bun.lock / tsconfig
        run: |
          set -euo pipefail
          found=$(find . -name package.json -o -name bun.lock -o -name tsconfig.json \
                    -o -name turbo.json -not -path './target/*' | grep -v '^./target' || true)
          if [ -n "$found" ]; then
            echo "::error::TypeScript build files found: $found"
            exit 1
          fi

  wasm:
    name: wasm32 boundary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      # Kept separate from `check`: a different rustc target means a different
      # set of artefacts, so this genuinely parallelises rather than queueing
      # behind the host build.
      #
      # §2.2: "the single most dangerous line in this workspace". A crate that
      # accidentally pulls tokio-net, reqwest or native TLS fails here in ~40s
      # instead of during a `dx build` three weeks later.
      - run: rustup target add wasm32-unknown-unknown
      - name: WASM-safe crates must cross-compile
        run: |
          cargo check --target wasm32-unknown-unknown \
            -p rv2-events -p rv2-domain -p rv2-api-types -p rv2-ui -p rv2-client \
            -p app -p web
      # The other half of the boundary: server-only crates must NOT be reachable
      # from the frontends. `cargo tree --invert` returning only the crate
      # itself proves nothing depends on it.
      - name: Server-only crates must not be reachable from the apps
        run: |
          set -euo pipefail
          for server_crate in rv2-allsource rv2-shared better-auth-allsource; do
            for wasm_app in app web; do
              if cargo tree --target wasm32-unknown-unknown -p "$wasm_app" \
                   --prefix none 2>/dev/null | grep -qx "$server_crate v.*"; then
                echo "::error::$wasm_app depends on the server-only crate $server_crate"
                exit 1
              fi
            done
          done

  supply-chain:
    name: supply chain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # NOT EmbarkStudios/cargo-deny-action: it runs in its own container, which
      # cannot install the toolchain pinned in rust-toolchain.toml ("override
      # toolchain '1.97.1-x86_64-unknown-linux-musl' is not installed"). It then
      # resolves the graph with a different cargo and reports bans that do not
      # reproduce locally — native-tls was flagged there while `cargo deny check`
      # was clean on a developer machine. A check that disagrees with local is
      # noise, so this runs cargo-deny under the repo's own toolchain.
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # rust-v1 learned this the hard way: `cargo audit` there only ran against
      # `tooling/meta`, so six advisories in `apps/api` — including a quinn-proto
      # remote memory exhaustion and a reachable panic in rustls-webpki CRL
      # parsing — sat unnoticed.
      #
      # This workspace has ONE root Cargo.lock covering every member, so a single
      # run at the root genuinely covers all of them. This assertion is what
      # keeps that true: add a nested lockfile (a member excluded from the
      # workspace) and CI fails, rather than quietly checking less than it claims.
      - name: Assert one lockfile covers every member
        run: |
          set -euo pipefail
          nested=$(find . -name Cargo.lock -not -path ./Cargo.lock -not -path './target/*')
          if [ -n "$nested" ]; then
            echo "::error::nested lockfile(s) found; a root-level check would not cover them:"
            echo "$nested"
            exit 1
          fi
          echo "members covered by ./Cargo.lock:"
          cargo metadata --no-deps --format-version 1 | jq -r '.packages[].name' | sort

      # `cargo deny check advisories` reads the same RustSec database as
      # `cargo audit` and additionally enforces bans, licences and sources. The
      # separate `cargo audit` job it replaces was running the same query twice.
      - run: cargo install cargo-deny --locked
      - run: cargo deny check advisories bans licenses sources

  live-core:
    name: live Core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      # `allsource-core` is a plain crates.io binary, so CI needs no service
      # container and no registry credentials. (The public community images —
      # `ghcr.io/all-source-os/allsource-core-community` — are amd64-only and
      # would work here too; the binary is simply fewer moving parts.)
      - run: cargo install allsource-core --version 0.23.0 --locked
      - name: Start Core
        run: |
          ALLSOURCE_HOST=127.0.0.1 ALLSOURCE_PORT=3900 \
          ALLSOURCE_DATA_DIR="$RUNNER_TEMP/allsource" ALLSOURCE_DEV_MODE=true \
            allsource-core &
          for _ in $(seq 1 30); do
            curl -sf http://localhost:3900/health && break
            sleep 1
          done
          curl -sf http://localhost:3900/health

      # Contract first: it asserts WHICH Core behaviours everything else relies
      # on, so when an assumption breaks the failure names the behaviour instead
      # of surfacing as a confusing 404 in the slice below.
      - name: Assert the Core contract
        env:
          ALLSOURCE_CORE_URL: http://localhost:3900
        run: cargo test -p rv2-allsource --test core_contract -- --ignored --test-threads=1

      - name: Run the acceptance test
        env:
          ALLSOURCE_CORE_URL: http://localhost:3900
          ALLSOURCE_QUERY_URL: http://localhost:3900
          ALLSOURCE_API_KEY: dev
          JWT_SECRET: ci-secret-key-that-is-at-least-32-characters-long
        # `--features allsource-auth` so the vendored better-auth adapter is
        # exercised against a real Core too, not just the memory adapter.
        run: |
          cargo test -p api --features allsource-auth --test vertical_slice \
            -- --ignored --nocapture --test-threads=1
